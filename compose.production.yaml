name: it-knowledge-atlas-prod
services:
  db:
    image: postgres:16.11-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: atlas_prod
      POSTGRES_USER: atlas_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas_owner -d atlas_prod"]
      interval: 5s
      timeout: 3s
      retries: 12
  app:
    build: .
    restart: unless-stopped
    environment:
      APP_ORIGIN: ${APP_ORIGIN:?Set APP_ORIGIN}
      AUTH_USERNAME: ${AUTH_USERNAME:?Set AUTH_USERNAME}
      AUTH_PASSWORD_HASH: ${AUTH_PASSWORD_HASH:?Set AUTH_PASSWORD_HASH}
      AUTH_SESSION_DAYS: ${AUTH_SESSION_DAYS:-30}
      DATABASE_URL: postgresql://atlas_app:${APP_DB_PASSWORD:?Set APP_DB_PASSWORD}@db:5432/atlas_prod
    ports:
      - "127.0.0.1:${ATLAS_PORT:-3002}:3002"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3002/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
  migrate:
    profiles: ["tools"]
    build: .
    restart: "no"
    environment:
      DATABASE_URL: postgresql://atlas_owner:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/atlas_prod
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD}
    command: ["node", "scripts/deploy/migrate.mjs"]
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres-data:
