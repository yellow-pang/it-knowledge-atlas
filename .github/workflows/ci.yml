name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    name: 코드·콘텐츠 검사
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 소스 가져오기
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Node.js 설정
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: 의존성 설치
        run: npm ci
      - name: 단위 테스트
        run: npm test
      - name: 콘텐츠 검사
        run: npm run content:check
      - name: 타입 검사
        run: npm run typecheck
      - name: 린트
        run: npm run lint
      - name: 프로덕션 빌드
        run: npm run build
